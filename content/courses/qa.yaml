# Titles and order: original project brief. Descriptions: drafts for the QA expert.
key: qa.testing
title: Software Testing and Quality Engineering
role_profile: qa
review_status: draft
source: Milestone Catalog and Demo Task Deliverables, 8 Nov 2026, section 4
description: Test the Smart Knowledge Portal and report on its quality.
final_deliverable: Test suite, execution report, defect log, automated regression tests
milestones:
  - {key: qa.m1, position: 1, title: "Requirement understanding", description: "Review the application and requirements; list questions, assumptions and risks."}
  - {key: qa.m2, position: 2, title: "Test scenario preparation", description: "Identify scenarios that cover the requirements, mapped to requirement IDs."}
  - {key: qa.m3, position: 3, title: "Test case preparation", description: "Write test cases for login and search that the platform runs against the reference application."}
  - {key: qa.m4, position: 4, title: "Functional testing", description: "Run the test cases against the reference application and record actual results."}
  - {key: qa.m5, position: 5, title: "Negative testing", description: "Design and run negative and edge-case tests."}
  - {key: qa.m6, position: 6, title: "API testing", description: "Test the portal's APIs for responses and validation."}
  - {key: qa.m7, position: 7, title: "Database testing", description: "Check data integrity with SQL queries."}
  - {key: qa.m8, position: 8, title: "Defect reporting", description: "Report defects with clear steps and classify their severity."}
  - {key: qa.m9, position: 9, title: "Test automation", description: "Automate selected test cases so they run reliably and repeatably."}
  - {key: qa.m10, position: 10, title: "Integration and regression testing", description: "Run regression and integration suites and report overall quality."}
